services:
  - type: web
    name: syntropy-backend
    env: node
    buildCommand: npm install
    startCommand: node src/Backend/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: syntropy-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://syntropy-backend.onrender.com/api/auth/google/callback
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app

databases:
  - name: syntropy-db
    databaseName: neondb
    user: neondb_owner